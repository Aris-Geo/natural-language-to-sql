services:
  # PostgreSQL with sample data
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: ecommerce_demo
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d ecommerce_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - text-to-sql-network

  # Ollama service for LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - text-to-sql-network

  # Schema validation service
  schema-validator:
    build: ./services/schema_validator
    container_name: schema-validator
    environment:
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - text-to-sql-network

  # Query generation service
  query-generator:
    build: ./services/query_generator
    container_name: query-generator
    environment:
      - DEBUG=true
      - OLLAMA_HOST=ollama
      - OLLAMA_MODEL=codellama:7b
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - text-to-sql-network

  # Query execution service
  query-executor:
    build: ./services/query_executor
    container_name: query-executor
    environment:
      - DEBUG=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - text-to-sql-network

  # API Gateway - Main entry point
  api-gateway:
    build: ./services/api_gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - DEFAULT_DB_HOST=postgres
      - DEFAULT_DB_PORT=5432
      - DEFAULT_DB_NAME=ecommerce_demo
      - DEFAULT_DB_USERNAME=demo_user
      - DEFAULT_DB_PASSWORD=demo_pass
    depends_on:
      - schema-validator
      - query-generator
      - query-executor
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - text-to-sql-network

volumes:
  postgres_data:
  ollama_data:

networks:
  text-to-sql-network:
    driver: bridge